<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Resume Broadsheet: an offline NLP résumé matcher. Compare a résumé with a job description using skill extraction, TF-IDF and cosine similarity." />
    <title>The Resume Broadsheet</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('rm-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'morning')
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

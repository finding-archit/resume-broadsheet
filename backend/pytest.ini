[pytest]
testpaths = tests
filterwarnings =
    # Emitted by PyMuPDF's SWIG bindings on Python 3.12; harmless.
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
    # Newer Starlette prefers "httpx2" for its TestClient; httpx still works.
    ignore:Using .httpx. with .starlette.testclient. is deprecated
